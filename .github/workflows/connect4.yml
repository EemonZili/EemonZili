name: Connect Four

on:
  issues:
    types: [opened]

concurrency:
  group: connect4
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  move:
    if: startsWith(github.event.issue.title, 'connect4|')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Play move
        id: move
        env:
          TITLE: ${{ github.event.issue.title }}
          LOGIN: ${{ github.event.issue.user.login }}
        run: |
          set +e
          msg=$(python scripts/connect4.py move "$TITLE" "$LOGIN")
          code=$?
          set -e
          echo "$msg"
          { echo 'msg<<MSG_EOF'; echo "$msg"; echo 'MSG_EOF'; } >> "$GITHUB_OUTPUT"
          if [ "$code" -eq 0 ]; then echo "ok=true" >> "$GITHUB_OUTPUT";
          elif [ "$code" -eq 3 ]; then echo "ok=false" >> "$GITHUB_OUTPUT";
          else exit "$code"; fi

      - name: Commit board
        if: steps.move.outputs.ok == 'true'
        env:
          LOGIN: ${{ github.event.issue.user.login }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md game assets/connect4
          git commit -m "connect4: move by @$LOGIN"
          for i in 1 2 3; do
            git push && exit 0
            git pull --rebase
          done
          exit 1

      - name: Reply and close issue
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number }}
          MSG: ${{ steps.move.outputs.msg }}
        run: |
          gh issue comment "$NUMBER" --repo "$GITHUB_REPOSITORY" \
            --body "$MSG

          Back to the board: https://github.com/${GITHUB_REPOSITORY%%/*}"
          gh issue close "$NUMBER" --repo "$GITHUB_REPOSITORY"
